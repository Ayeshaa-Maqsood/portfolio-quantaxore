<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="qg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#040711"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#qg)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Quantum Core Rings -->
  <circle cx="50" cy="50" r="30" stroke="url(#qg)" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow)"/>
  <!-- Inner Diamond -->
  <path d="M50 28 L72 50 L50 72 L28 50 Z" stroke="#00f2fe" stroke-width="2.5" fill="none"/>
  <!-- Center Core -->
  <circle cx="50" cy="50" r="8" fill="url(#qg)"/>
  <!-- Quantum crossbars -->
  <line x1="36" y1="50" x2="64" y2="50" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="50" y1="36" x2="50" y2="64" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Tail for Q -->
  <path d="M60 60 L75 75" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
</svg>

