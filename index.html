<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logos/quantaxore-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantaXore — Digital Work, Considered | AI • Automation • Software • SaaS</title>
    <meta name="description" content="QuantaXore is an early-stage hybrid technology collective architecting bespoke digital web experiences, intelligent AI automation pipelines, and custom business systems." />
    <meta name="keywords" content="QuantaXore, AI Automation, Web Development, SaaS, Business Systems, Custom Software" />
    <meta name="theme-color" content="#040711" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN with Custom Theme Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              void: '#040711',
              surface: {
                50: '#0b1120',
                100: '#0f172a',
                200: '#141f36',
                300: '#1a2744',
                card: 'rgba(15, 23, 42, 0.75)',
                border: 'rgba(255, 255, 255, 0.08)',
                'border-highlight': 'rgba(56, 189, 248, 0.35)',
              },
              brand: {
                cyan: '#00f2fe',
                blue: '#4facfe',
                violet: '#8b5cf6',
                indigo: '#6366f1',
                emerald: '#10b981',
                accent: '#06b6d4',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            animation: {
              'pulse-slow': 'pulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 5s ease-in-out infinite',
              'float-reverse': 'floatReverse 6s ease-in-out infinite',
              'spin-slow': 'spin 30s linear infinite',
              'glow-pulse': 'glowPulse 4s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s infinite linear',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              floatReverse: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(10px)' },
              },
              glowPulse: {
                '0%, 100%': { opacity: '0.4', filter: 'blur(35px)' },
                '50%': { opacity: '0.8', filter: 'blur(55px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#040711] text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-cyan-500/25 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
